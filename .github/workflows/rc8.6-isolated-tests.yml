name: RC8.6 Isolated Tests

on:
  workflow_dispatch:
  push:
    branches:
      - release/rc8.6
    paths:
      - 'tests/**'
      - 'src/**'
      - 'scripts/**'
      - '01_MU_Safety_Assistant_V1.50_RC8.6_試作版_一鍵安裝.html'
      - '02_Bookmarklet_備用手動安裝_RC8.6.txt'
      - '.github/workflows/rc8.6-isolated-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    name: RC8.6 isolated regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out RC8.6 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify RC8.6 onboarding and multi-user readiness
        run: node tests/rc8.6-multi-user-readiness-check.js

      - name: Verify RC8.6 settings restore isolation
        run: node tests/rc8.6-settings-restore-check.js

      - name: Verify RC8.5 backup and restore
        run: node tests/rc8.5-backup-restore-check.js

      - name: Verify RC8.4 document work and Excel reports
        run: node tests/rc8.4-document-work-check.js

      - name: Verify RC8.3 Excel and project notes
        run: node tests/rc8.3-excel-project-notes-check.js

      - name: Verify RC8.2 record filtering
        run: node tests/rc8.2-record-filter-check.js

      - name: Verify RC8.1 statistics
        run: node tests/rc8.1-statistics-check.js

      - name: Verify RC7 records DOM behavior
        run: node tests/rc7-records-dom-check.js

      - name: Verify RC7 regression
        run: node tests/rc7-static-check.js

      - name: Verify RC6 regression
        run: node tests/rc6-static-check.js

      - name: Verify RC8.6 current-source runtime
        run: node tests/rc8.6-current-runtime-check.js

      - name: Verify quarterly management calculations
        run: node tests/rc8.6-quarter-report-check.js

      - name: Verify OOXML package relationships
        run: python3 tests/rc8.6-xlsx-package-check.py

      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/mu-browser" playwright@1.62.1
          "$RUNNER_TEMP/mu-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify RC8.6 in isolated real Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/mu-browser/node_modules
        run: node tests/rc8.6-browser-check.js

      - name: Preserve generated test workbooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8.6-acceptance-evidence
          path: test-results/
